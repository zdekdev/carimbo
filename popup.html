<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuracoes - Assinatura WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 460px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
            color: #111827;
        }

        .container {
            padding: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: #22c55e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon svg {
            width: 24px;
            height: 24px;
            color: #fff;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 700;
        }

        .header p {
            font-size: 11px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        /* Formatting toolbar */
        .fmt-toolbar {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }

        .fmt-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            transition: all 0.15s;
        }

        .fmt-btn:hover {
            background: #e5e7eb;
            border-color: #9ca3af;
        }

        .fmt-btn:active {
            background: #d1d5db;
        }

        .fmt-btn.active {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .fmt-btn.bold {
            font-weight: 800;
        }

        .fmt-btn.italic {
            font-style: italic;
            font-family: Georgia, serif;
        }

        .fmt-btn.mono {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: 700;
        }

        /* Break count control */
        .fmt-break-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }

        .fmt-break-label {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            white-space: nowrap;
        }

        .fmt-break-input {
            width: 38px;
            height: 34px;
            text-align: center;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            background: #fff;
            -moz-appearance: textfield;
        }

        .fmt-break-input::-webkit-inner-spin-button,
        .fmt-break-input::-webkit-outer-spin-button {
            opacity: 1;
            height: 30px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .form-hint {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Auto-signature toggle */
        .auto-sign-row {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
        }

        .auto-sign-label {
            display: flex !important;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px !important;
            font-weight: 600 !important;
            margin-bottom: 2px !important;
            color: #374151 !important;
        }

        .auto-sign-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #22c55e;
            cursor: pointer;
        }

        /* Shortcut section disabled state */
        .shortcut-disabled {
            opacity: 0.4;
            pointer-events: none;
            user-select: none;
        }

        .shortcut-row {
            display: flex;
            gap: 8px;
        }

        .shortcut-btn {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: #fff;
            text-align: center;
            transition: all 0.2s;
        }

        .shortcut-btn:hover {
            background: #f3f4f6;
        }

        .shortcut-btn.listening {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
        }

        .shortcut-reset {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            color: #9ca3af;
            transition: all 0.2s;
        }

        .shortcut-reset:hover {
            color: #6b7280;
            background: #f3f4f6;
        }

        .shortcut-reset svg {
            display: block;
        }

        /* Preview wrappers */
        .preview-box {
            background: #f3f4f6;
            border-radius: 8px;
            padding: 12px;
        }

        .preview-box label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: #9ca3af;
            display: block;
            margin-bottom: 6px;
        }

        /* Chat bubble preview */
        .chat-bubble {
            display: flex;
            justify-content: flex-end;
        }

        .chat-bubble-content {
            background: #d9fdd3;
            border-radius: 8px 4px 8px 8px;
            padding: 8px 12px;
            font-size: 13px;
            color: #111b21;
            max-width: 85%;
            word-break: break-word;
            line-height: 1.4;
            box-shadow: 0 1px 1px rgba(0,0,0,0.08);
            min-height: 20px;
            position: relative;
        }

        .chat-bubble-content:empty::after {
            content: 'Sua assinatura aparecera aqui';
            color: #8696a0;
            font-style: italic;
        }

        .chat-bubble-content b {
            font-weight: 700;
        }

        .chat-bubble-content i {
            font-style: italic;
        }

        .chat-bubble-content s {
            text-decoration: line-through;
        }

        .chat-bubble-content code {
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.06);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px;
        }

        /* Chat input field preview */
        .chat-input-sim {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            min-height: 40px;
        }

        .chat-input-sim-content {
            font-size: 14px;
            color: #3b4a54;
            line-height: 1.4;
            word-break: break-word;
            flex: 1;
        }

        .chat-input-sim-content:empty::after {
            content: 'Digite uma mensagem';
            color: #8696a0;
            font-style: italic;
        }

        .chat-input-sim::after {
            content: '';
            width: 24px;
            height: 24px;
            background: #00a884;
            border-radius: 50%;
            flex-shrink: 0;
            margin-left: 8px;
            opacity: 0.5;
        }

        .fmt-break-label-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .fmt-break-label-container label {
            font-size: 10px;
            font-weight: 600;
            color: #374151;
        }

        .footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
            </div>
            <div>
                <h1>Assinatura Auto</h1>
                <p>WhatsApp Web</p>
            </div>
        </div>

        <!-- Form -->
        <form id="config-form">
            <!-- Signature Input -->
            <div class="form-group">
                <div class="fmt-break-label-container">
                    <label for="signature">Botoes de Formatacao</label>
                    <label class="fmt-break-label" title="Quebras de linha apos a assinatura">Quebras de linha</label>
                </div>

                <!-- Formatting toolbar -->
                <div class="fmt-toolbar">
                    <button type="button" class="fmt-btn bold" data-fmt="bold" title="Negrito (*texto*)">B</button>
                    <button type="button" class="fmt-btn italic" data-fmt="italic" title="Italico (_texto_)">I</button>
                    <button type="button" class="fmt-btn" data-fmt="strikethrough" title="Riscado (~texto~)">S</button>
                    <button type="button" class="fmt-btn mono" data-fmt="mono"
                        title="Monospace (`texto`)">&lt;/&gt;</button>
                    <div class="fmt-break-group">
                        <input type="number" id="break-count" class="fmt-break-input" value="2" min="0" max="10"
                            title="Quantidade de quebras de linha">
                    </div>
                </div>
                <input type="text" id="signature" maxlength="40"
                    placeholder="Digite sua assinatura (max. 40 caracteres)"
                    autocomplete="off">
                <input type="hidden" id="signature-md">
                <p class="form-hint"><span id="char-count">0</span>/40 caracteres</p>

                <!-- Auto-signature toggle -->
                <div class="auto-sign-row">
                    <label class="auto-sign-label" for="auto-sign">
                        <input type="checkbox" id="auto-sign">
                        <span>Assinatura automatica</span>
                    </label>
                    <p class="form-hint">Insere a assinatura automaticamente ao abrir um chat. O atalho de teclado sera desativado.</p>
                </div>
            </div>

            <!-- Preview: Chat (formatado) -->
            <div class="preview-box form-group">
                <label>Pre-visualizacao no chat</label>
                <div class="chat-bubble">
                    <div id="preview-chat" class="chat-bubble-content"></div>
                </div>
            </div>

            <!-- Preview: Campo de digitacao -->
            <div class="preview-box form-group">
                <label>Pre-visualizacao no campo de digitacao</label>
                <div class="chat-input-sim">
                    <div id="preview-input" class="chat-input-sim-content"></div>
                </div>
            </div>

            <!-- Shortcut Key -->
            <div class="form-group" id="shortcut-section">
                <label>Tecla de Atalho</label>
                <div class="shortcut-row">
                    <button type="button" id="shortcut-btn" class="shortcut-btn">Tab</button>
                    <button type="button" id="shortcut-reset" class="shortcut-reset" title="Restaurar padrao (Tab)">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                    </button>
                </div>
                <p class="form-hint">Tecla padrao: Tab</p>
            </div>

        </form>

        <!-- Footer -->
        <div class="footer">
            Abra o WhatsApp Web e use a tecla de atalho configurada
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
